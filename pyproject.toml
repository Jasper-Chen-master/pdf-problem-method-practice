[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-problem-method-practice"
version = "0.2.0"
description = "Agent-agnostic skill and local utilities for solution-grounded practice banks from problem PDFs (any subject)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["pdfplumber>=0.11,<1"]

[project.urls]
Homepage = "https://github.com/Jasper-Chen-master/pdf-problem-method-practice"
Issues = "https://github.com/Jasper-Chen-master/pdf-problem-method-practice/issues"

[tool.setuptools]
packages = ["scripts"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
